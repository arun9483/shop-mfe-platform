# Single sign-on (MVP-2): the shop's identity provider, Keycloak, on top of compose.yaml.
#
#   docker compose -f docker/compose.yaml -f docker/compose.sso.yaml up -d --wait
#
# Without this file the stack is MVP-1 unchanged. Keycloak is public only through nginx on
# https://shop.test:8443, which refuses /admin; its admin console is on 127.0.0.1 only, for debugging.
# Every repository's keycloak/ settings are applied in two passes: each repository's own clients,
# roles, groups and memberships, then grants.yaml files, which name other repositories' service accounts.

x-importer: &importer
  image: adorsys/keycloak-config-cli:6.5.1-26.1.0
  restart: 'no'
  depends_on:
    keycloak:
      condition: service_healthy
  env_file:
    - path: .env
    - path: ../../shop-shell/keycloak/.env
    - path: ../../shop-catalog/keycloak/.env
    - path: ../../shop-cart/keycloak/.env
    - path: ../../shop-router/keycloak/.env
      required: false
  environment: &importer-env
    KEYCLOAK_URL: http://keycloak:8080
    KEYCLOAK_USER: ${KEYCLOAK_ADMIN_USER:?set in docker/.env}
    KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in docker/.env}
    KEYCLOAK_AVAILABILITYCHECK_ENABLED: 'true'
    IMPORT_VARSUBSTITUTION_ENABLED: 'true'
    # Several files share one realm: an import must never delete what another file created.
    IMPORT_MANAGED_CLIENT: no-delete
    IMPORT_MANAGED_ROLE: no-delete
    IMPORT_MANAGED_CLIENTSCOPE: no-delete
    IMPORT_MANAGED_CLIENTSCOPEMAPPING: no-delete
    IMPORT_MANAGED_SCOPEMAPPING: no-delete
    IMPORT_MANAGED_GROUP: no-delete
    IMPORT_MANAGED_SUBGROUP: no-delete
    # A user's client roles in a file replace all their client roles, so roles are granted through
    # each repository's groups, and memberships from every file are kept.
    IMPORT_USERS_MERGEGROUPS: 'true'
    IMPORT_USERS_MERGEROLES: 'true'
    IMPORT_MANAGED_REQUIREDACTION: no-delete
    IMPORT_MANAGED_COMPONENT: no-delete
    IMPORT_MANAGED_SUBCOMPONENT: no-delete
    IMPORT_MANAGED_AUTHENTICATIONFLOW: no-delete
    IMPORT_MANAGED_IDENTITYPROVIDER: no-delete
    IMPORT_MANAGED_IDENTITYPROVIDERMAPPER: no-delete
  volumes:
    - ../keycloak:/config/00-platform:ro
    - ../../shop-shell/keycloak:/config/shop-shell:ro
    - ../../shop-catalog/keycloak:/config/shop-catalog:ro
    - ../../shop-cart/keycloak:/config/shop-cart:ro
    - ../../shop-router/keycloak:/config/shop-router:ro
  networks: [idp]

# What a server needs to reach the IdP: the issuer tokens carry, and Keycloak inside Docker.
x-sign-in: &sign-in
  AUTH_ENABLED: 'true'
  OIDC_ISSUER_URL: https://shop.test:8443/realms/shop
  OIDC_INTERNAL_URL: http://keycloak:8080/realms/shop

services:
  nginx:
    ports:
      - '8443:8443'
    volumes:
      - ./nginx/idp.conf:/etc/nginx/conf.d/idp.conf:ro
    networks:
      edge:
        # Containers on the edge network reach the public origins as a browser does.
        aliases: [shop.test]
      idp:

  shop-router:
    networks: [edge, units, idp]
  # Sign-in on for the Shell (MVP-2 phase 2). Each server's client ID and secret stay in its own .env.
  shell-fes:
    networks: [units, shell, idp]
    environment:
      <<: *sign-in
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://shop.test}
  shell-backend:
    networks: [shell, idp]
    environment: *sign-in
  catalog-fes:
    networks: [units, catalog, idp]
  catalog-backend:
    networks: [catalog, idp]
  cart-fes:
    networks: [units, cart, idp]
  cart-backend:
    networks: [cart, idp]

  keycloak-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in docker/.env}
    volumes:
      - keycloak-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'keycloak', '-d', 'keycloak']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [idp-db]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in docker/.env}
      # The issuer every token carries; servers reach Keycloak inside Docker on keycloak:8080.
      KC_HOSTNAME: https://shop.test:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_DEBUG_PORT:-8081}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in docker/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in docker/.env}
    ports:
      # Debugging only: the admin console at http://localhost:8081/admin, never on other interfaces.
      - '127.0.0.1:${KEYCLOAK_DEBUG_PORT:-8081}:8080'
    healthcheck:
      # The image has no curl: ask the management port for readiness over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [idp, idp-db]

  # Pass 1: realm basics, then each repository's own clients, roles and grants.
  keycloak-config:
    <<: *importer
    environment:
      <<: *importer-env
      IMPORT_FILES_LOCATIONS: file:/config/00-platform/realm.yaml,file:/config/shop-*/shop-*.yaml

  # Pass 2: grants that name another repository's service account, which pass 1 created.
  keycloak-grants:
    <<: *importer
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
    environment:
      <<: *importer-env
      IMPORT_FILES_LOCATIONS: file:/config/shop-*/grants.yaml

volumes:
  keycloak-db:

networks:
  idp:
  idp-db:
