# The shop's identity provider, Keycloak, on its own origin: https://<public host>:8443. Loaded only with
# compose.sso.yaml. Sign-in pages and OIDC endpoints only: the admin console and admin API are refused here.
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 8443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_cache off;

    set $keycloak keycloak:8080;

    location / {
        proxy_pass http://$keycloak;
    }

    location /admin {
        return 404;
    }
}
