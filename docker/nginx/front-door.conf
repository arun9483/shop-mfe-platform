# The local front door (MVP-3 phase 3): Docker Desktop can publish port 443 only once, so this nginx takes
# it and routes each host name (SNI, TLS passthrough) to that tenant's own nginx, published on
# 127.0.0.1:<TENANT_HTTPS_PORT>. It holds no certificate and no logic: it stands in for each tenant's own
# DNS and load balancer. Adding a tenant: its two hosts here, and its port in its settings file.
worker_processes 1;
events {}

stream {
    upstream tenant_orga { server host.docker.internal:8443; }
    upstream tenant_orgb { server host.docker.internal:9443; }

    map $ssl_preread_server_name $tenant {
        orga.shop.test tenant_orga;
        orga-idp.test  tenant_orga;
        orgb.shop.test tenant_orgb;
        orgb-idp.test  tenant_orgb;
        # Any other host name is not a tenant: the connection is closed.
        default        unknown_host;
    }
    upstream unknown_host { server 127.0.0.1:1; }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $tenant;
    }
}

http {
    # Plain HTTP goes to HTTPS on the same host.
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }
}
