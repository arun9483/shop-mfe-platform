# HTTPS, compression and the edge cache in front of shop-router. It names no domain: changing the
# public origin needs no change here. What it caches is decided by each FES's Cache-Control header.
proxy_cache_path /var/cache/nginx/shop keys_zone=shop:10m max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Docker's DNS, looked up again every 2 s, so every router pod gets traffic and a replaced pod needs no
# nginx restart. This takes a variable in proxy_pass.
resolver 127.0.0.11 valid=2s;

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    gzip on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache shop;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;

    # A stopped pod's address stays in DNS for a moment: move on to the next pod instead of waiting.
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout;

    set $router shop-router:3000;

    location / {
        proxy_pass http://$router;
    }

    # API responses are never cached, whatever headers they carry.
    location /api/ {
        proxy_cache off;
        proxy_pass http://$router;
    }
}
